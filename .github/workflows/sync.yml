name: Sync RoscomVPN geodata compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync.yml"
      - "scripts/**"
      - "README.md"
  schedule:
    # Twice weekly (Monday and Thursday), away from :00 to reduce scheduler
    # congestion. This keeps updates at most 3-4 days behind upstream.
    - cron: "17 3 * * 1,4"

concurrency:
  group: roscomvpn-yandex-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      geodata_changed: ${{ steps.sync.outputs.geodata_changed }}
      geosite_sha256: ${{ steps.sync.outputs.geosite_sha256 }}
      geoip_sha256: ${{ steps.sync.outputs.geoip_sha256 }}
      public_base_url: ${{ steps.sync.outputs.public_base_url }}
      deploy_pages: ${{ steps.pages.outputs.publish }}

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clone upstream repositories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$RUNNER_TEMP/roscomvpn-routing" \
            "$RUNNER_TEMP/roscomvpn-geosite" \
            "$RUNNER_TEMP/roscomvpn-geoip" \
            "$RUNNER_TEMP/v2fly" \
            "$RUNNER_TEMP/v2fly-geoip"

          git clone --depth 1 \
            https://github.com/hydraponique/roscomvpn-routing.git \
            "$RUNNER_TEMP/roscomvpn-routing"

          git clone --depth 1 \
            https://github.com/hydraponique/roscomvpn-geosite.git \
            "$RUNNER_TEMP/roscomvpn-geosite"

          git clone --depth 1 \
            https://github.com/v2fly/domain-list-community.git \
            "$RUNNER_TEMP/v2fly"

          # These release branches contain the exact binaries consumed below.
          git clone --depth 1 --branch release --single-branch \
            https://github.com/hydraponique/roscomvpn-geoip.git \
            "$RUNNER_TEMP/roscomvpn-geoip"

          git clone --depth 1 --branch release --single-branch \
            https://github.com/v2fly/geoip.git \
            "$RUNNER_TEMP/v2fly-geoip"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ runner.temp }}/v2fly/go.mod
          cache: true
          cache-dependency-path: ${{ runner.temp }}/v2fly/go.sum

      - name: Build routing profiles, geosite and installer site
        id: sync
        env:
          ROUTING_SRC: ${{ runner.temp }}/roscomvpn-routing
          GEOSITE_SRC: ${{ runner.temp }}/roscomvpn-geosite
          V2FLY_SRC: ${{ runner.temp }}/v2fly
          GEOIP_SRC: ${{ runner.temp }}/roscomvpn-geoip
          V2FLY_GEOIP_SRC: ${{ runner.temp }}/v2fly-geoip
          WORK_DIR: ${{ runner.temp }}/roscomvpn-yandex-build

          # Optional repository variable. Leave empty to use the standard
          # https://OWNER.github.io/REPO/ Pages URL.
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: python3 scripts/sync.py

      - name: Check release branch contents
        id: release
        shell: bash
        run: |
          set -euo pipefail

          CHECK_DIR="$(mktemp -d "$RUNNER_TEMP/roscomvpn-release-check.XXXXXX")"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          publish=true

          if git fetch --no-tags --depth 1 origin refs/heads/release; then
            cp .build/geosite.dat "$CHECK_DIR/geosite.dat"
            cp .build/geoip.dat "$CHECK_DIR/geoip.dat"
            (
              cd "$CHECK_DIR"
              sha256sum geosite.dat > geosite.dat.sha256
              sha256sum geoip.dat > geoip.dat.sha256
            )

            remote_complete=true
            for file in geosite.dat geosite.dat.sha256 geoip.dat geoip.dat.sha256; do
              if ! git show "FETCH_HEAD:$file" > "$CHECK_DIR/remote-$file"; then
                remote_complete=false
                break
              fi
            done

            if [[ "$remote_complete" == true ]] \
              && cmp -s "$CHECK_DIR/geosite.dat" "$CHECK_DIR/remote-geosite.dat" \
              && cmp -s "$CHECK_DIR/geosite.dat.sha256" "$CHECK_DIR/remote-geosite.dat.sha256" \
              && cmp -s "$CHECK_DIR/geoip.dat" "$CHECK_DIR/remote-geoip.dat" \
              && cmp -s "$CHECK_DIR/geoip.dat.sha256" "$CHECK_DIR/remote-geoip.dat.sha256"; then
              publish=false
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Publish geodata to release branch
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN_FOR_PUSH: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/roscomvpn-release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp .build/geosite.dat "$RELEASE_DIR/geosite.dat"
          cp .build/geoip.dat "$RELEASE_DIR/geoip.dat"

          (
            cd "$RELEASE_DIR"
            sha256sum geosite.dat > geosite.dat.sha256
            sha256sum geoip.dat > geoip.dat.sha256

            git init
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b release

            git add geosite.dat geosite.dat.sha256 geoip.dat geoip.dat.sha256
            git commit -m "Compatible geodata ${{ steps.sync.outputs.geosite_sha256 }} ${{ steps.sync.outputs.geoip_sha256 }}"

            git remote add origin \
              "https://x-access-token:${GH_TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin release
          )

      - name: Purge jsDelivr cache
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/geosite.dat" \
            >/dev/null || true
          curl -fsSL \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/geosite.dat.sha256" \
            >/dev/null || true
          curl -fsSL \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/geoip.dat" \
            >/dev/null || true
          curl -fsSL \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/geoip.dat.sha256" \
            >/dev/null || true

      - name: Commit generated profiles
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add HAPP .state.json

          if git diff --cached --quiet; then
            echo "No main-branch changes."
            exit 0
          fi

          git commit -m "Sync RoscomVPN routing and compatible geodata"
          git push

      - name: Decide whether to deploy Pages
        id: pages
        env:
          GENERATED_CHANGED: ${{ steps.sync.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          publish=false
          if [[ "$GENERATED_CHANGED" == "true" || "$EVENT_NAME" != "schedule" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Scheduled no-change checks do not upload or redeploy an identical site.
      # Manual and source-code-triggered runs still deploy, which supports
      # first-time setup and explicit recovery of a missing Pages deployment.
      - name: Upload GitHub Pages artifact
        if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy-pages:
    needs: sync
    if: needs.sync.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy stable Happ installer
        id: deployment
        uses: actions/deploy-pages@v4
